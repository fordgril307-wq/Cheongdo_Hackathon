<title>청도 시네마 투어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 영화제 공식 사이트 구조 — 상단 고정 내비 + 해시 라우팅 화면(홈·상영시간표·좌석·AI 코스·내 티켓·관객상·안내·운영자). 밤의 돔(남색) 위에 모래판(모래색)과 감(주황) */
:root{
  --bg:#F5F1E8; --surface:#FFFFFF; --surface2:#EDE6D6; --line:#D8CDB6;
  --fg:#1A1D2E; --muted:#5B5F6E; --accent:#C2410C; --accent-fg:#FFFFFF;
  --night:#14193A; --night-fg:#F3EEE2; --sand:#B08A4E; --sand-soft:#E9DCC0;
  --ok:#2F7A4F; --warn:#9A6400; --seat:#FFFFFF; --seat-taken:#CFC6B4; --seat-line:#14193A;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1230; --surface:#171C42; --surface2:#1F2552; --line:#2E3566;
  --fg:#F1ECDF; --muted:#AEB2C8; --accent:#F07A3E; --accent-fg:#1A0E05;
  --night:#0A0D24; --night-fg:#F1ECDF; --sand:#D9BC86; --sand-soft:#2A2A4A;
  --ok:#5FC08A; --warn:#E3B04B; --seat:#202657; --seat-taken:#3A3F63; --seat-line:#D9BC86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1230; --surface:#171C42; --surface2:#1F2552; --line:#2E3566;
  --fg:#F1ECDF; --muted:#AEB2C8; --accent:#F07A3E; --accent-fg:#1A0E05;
  --night:#0A0D24; --night-fg:#F1ECDF; --sand:#D9BC86; --sand-soft:#2A2A4A;
  --ok:#5FC08A; --warn:#E3B04B; --seat:#202657; --seat-taken:#3A3F63; --seat-line:#D9BC86; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--night);color:var(--night-fg)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.5px;text-decoration:none;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--body);font-size:11px;font-weight:500;opacity:.75;letter-spacing:.08em}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.main a{text-decoration:none;font-size:14px;padding:8px 11px;border-radius:8px;opacity:.85}
nav.main a[aria-current="page"]{background:var(--accent);color:var(--accent-fg);opacity:1;font-weight:700}
.demo-bar{background:var(--sand-soft);color:var(--fg);font-size:12.5px}
.demo-bar .wrap{padding-block:6px}
main{padding-block:28px 64px}
h1,h2,h3{text-wrap:balance;margin:0}
h2.sec{font-family:var(--display);font-size:30px;font-weight:400;letter-spacing:.3px}
.lead{color:var(--muted);max-width:62ch;margin:6px 0 0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip.gv{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.ev{border-color:var(--sand);color:var(--sand)}
.code{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.rate{font-family:var(--mono);font-size:12px;font-weight:600;border:1.5px solid currentColor;border-radius:4px;padding:0 4px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
/* hero */
.hero{background:var(--night);color:var(--night-fg);border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1.3fr 1fr}
.hero .txt{padding:32px 28px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--sand);font-weight:700}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,6vw,60px);line-height:1.08}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;opacity:.88;max-width:46ch}
.hero .btn:not(.primary){background:transparent;color:var(--night-fg);border-color:color-mix(in srgb,var(--night-fg) 45%,transparent)}
.hero canvas{width:100%;height:100%;min-height:220px;display:block}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.fact b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--accent);font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--muted)}
.venues{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.venue{display:flex;flex-direction:column;gap:6px}
.venue .tag{font-family:var(--mono);font-size:12px;color:var(--sand);font-weight:600}
.venue h3{font-size:17px}
.venue p{margin:0;font-size:13.5px;color:var(--muted)}
.section{margin-top:34px;display:flex;flex-direction:column;gap:14px}
/* timetable */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.filters select{min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 10px}
.tt{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:72px 64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.slot .time{font-family:var(--mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.slot .vcode{font-family:var(--mono);font-size:12px;color:var(--muted)}
.slot h3{font-size:16px}
.slot .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center;font-size:12.5px}
.slot .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--surface2);width:96px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sand)}
.legend{font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
/* seats */
.seatwrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.screen{height:26px;border-radius:0 0 60px 60px;background:var(--sand);color:var(--night);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-bottom:14px}
.seats{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.seat{aspect-ratio:1;max-width:100%;border-radius:7px 7px 3px 3px;border:1.5px solid var(--seat-line);background:var(--seat);font-family:var(--mono);font-size:10px;font-weight:600;cursor:pointer;padding:0;min-height:28px}
.seat[data-s="taken"]{background:var(--seat-taken);border-color:transparent;color:var(--muted);cursor:not-allowed}
.seat[data-s="mine"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.seat[data-s="wheel"]{border-style:dashed}
.aisle{grid-column:span 12;height:4px}
.sum dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.sum dt{color:var(--muted)}
.sum dd{margin:0;font-weight:700}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--sand);padding-left:10px}
/* course */
.ask{display:flex;gap:8px;flex-wrap:wrap}
.ask input{flex:1 1 280px;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font-size:16px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;min-height:36px}
.parsed{display:flex;gap:8px;flex-wrap:wrap}
.parsed span{background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:13px}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--sand);margin-left:8px}
.step{position:relative;padding:0 0 18px 22px}
.step::before{content:"";position:absolute;left:-8px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--sand)}
.step.key::before{border-color:var(--accent);background:var(--accent)}
.step .t{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted)}
.step h3{font-size:16px}
.step p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.why{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:13.5px}
/* tickets */
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ticket .tophead{background:var(--night);color:var(--night-fg);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.ticket .body{padding:14px 16px;display:flex;gap:14px;align-items:center}
.ticket canvas{width:84px;height:84px;flex-shrink:0;image-rendering:pixelated;border-radius:6px;background:#fff}
.ticket .foot{border-top:2px dashed var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
/* vote */
.vote-list{display:flex;flex-direction:column;gap:10px}
.vote{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stars{display:flex;gap:4px}
.stars button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:900;font-size:16px}
.stars button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
/* info */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:700}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mapimg{border-radius:12px;border:1px solid var(--line);background:#fff;width:100%}
/* admin */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{font-family:var(--display);font-weight:400;font-size:30px;display:block;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.fillrow{display:grid;grid-template-columns:70px 120px minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.fillrow .bar{width:100%;height:10px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
footer{border-top:1px solid var(--line);padding-block:20px;font-size:12.5px;color:var(--muted)}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .facts,.venues,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seatwrap,.grid2{grid-template-columns:1fr}
  .slot{grid-template-columns:58px minmax(0,1fr);}
  .slot .vcode{display:none}
  .slot .side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  nav.main{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
  nav.main a{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function drawSand(){
  const c=document.getElementById("sand");if(!c)return;
  const r=c.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=Math.max(300,r.width)*dpr;c.height=Math.max(220,r.height)*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);
  const W=c.width/dpr,H=c.height/dpr;const cs=getComputedStyle(document.documentElement);
  const sand=cs.getPropertyValue("--sand").trim(),acc=cs.getPropertyValue("--accent").trim(),fg=cs.getPropertyValue("--night-fg").trim();
  // dome arc
  g.strokeStyle=fg;g.globalAlpha=.25;g.lineWidth=1;
  for(let i=0;i<7;i++){g.beginPath();g.ellipse(W/2,H*0.95,W*0.48-i*14,H*0.78-i*12,0,Math.PI,2*Math.PI);g.stroke();}
  // screen
  g.globalAlpha=.95;g.fillStyle=fg;g.fillRect(W*0.22,H*0.26,W*0.56,H*0.24);
  g.fillStyle=acc;g.globalAlpha=.9;g.fillRect(W*0.22,H*0.26,W*0.56,H*0.24*0.18);
  // sand floor dots
  let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  g.fillStyle=sand;for(let i=0;i<900;i++){const x=rnd()*W,y=H*0.62+Math.pow(rnd(),0.7)*H*0.38;g.globalAlpha=.25+rnd()*.6;g.fillRect(x,y,1.4,1.4);}
  // seat rows
  g.globalAlpha=.7;g.fillStyle=fg;for(let row=0;row<3;row++){for(let i=0;i<14;i++){g.fillRect(W*0.12+i*(W*0.76/14),H*0.66+row*14,W*0.76/14-4,8);}}
  g.globalAlpha=1;
}

function seatLayout(code){
  const s=byCode(code);let seed=parseInt(code,10);const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;

  rows.forEach((r,ri)=>{for(let n=1;n<=12;n++){const id=r+n;let st="free";if(rnd()*100<s[11])st="taken";if(ri===7&&(n===1||n===12))st=st==="taken"?st:"wheel";out.push({id,st});}});
  return out;
}

function parse(t){
  const p={day:3,people:2,car:true,stay:false};
  if(/화요일|화\b/.test(t))p.day=0;else if(/수요일/.test(t))p.day=1;else if(/목요일/.test(t))p.day=2;else if(/금요일/.test(t))p.day=3;
  const m=t.match(/(\d)\s*명/);if(m)p.people=+m[1];else if(/혼자/.test(t))p.people=1;else if(/둘|두 명|커플/.test(t))p.people=2;else if(/셋|세 명/.test(t))p.people=3;
  if(/차.{0,3}없|뚜벅|기차/.test(t))p.car=false;
  if(/1박|자고|숙박|하룻밤|주말까지|퇴근하고/.test(t))p.stay=true;
  if(/당일|막차|돌아/.test(t))p.stay=false;
  return p;
}

function qr(cv,text){
  const g=cv.getContext("2d");const N=25;cv.width=N;cv.height=N;g.fillStyle="#fff";g.fillRect(0,0,N,N);g.fillStyle="#111";
  let h=0;for(const ch of text)h=(h*31+ch.charCodeAt(0))>>>0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){h=(h*1103515245+12345)>>>0;if((h>>16)&1)g.fillRect(x,y,1,1)}
  [[0,0],[N-7,0],[0,N-7]].forEach(([x,y])=>{g.fillStyle="#111";g.fillRect(x,y,7,7);g.fillStyle="#fff";g.fillRect(x+1,y+1,5,5);g.fillStyle="#111";g.fillRect(x+2,y+2,3,3)});
}
function tickets(){
  const list=state.tickets.length?state.tickets:[{kind:"screen",code:"202",seats:["D6","D7"],title:"[예시] 반시가 익는 계절",when:"11.11(수) 19:00",venue:"모래판홀",price:20000,sample:true}];
  app.innerHTML=`
  <h2 class="sec">내 티켓</h2>
  <p class="lead">입장할 때 이 화면의 QR을 보여 주세요. 캡처 화면이나 문자로는 입장할 수 없습니다.</p>
  <div class="tickets section" style="margin-top:16px">${list.map((t,i)=>`
    <article class="ticket">
      <div class="tophead"><span class="code">${t.code}</span><span style="font-size:12px">${t.kind==="course"?"코스 패키지":"상영"}${t.sample?" · 예시":""}</span></div>
      <div class="body"><canvas data-qr="${esc(t.code+t.seats.join())}" aria-label="입장 QR (예시)"></canvas>
        <div style="min-width:0"><h3 style="font-size:15px">${esc(t.title)}</h3><div class="muted" style="font-size:13px">${esc(t.when)}<br>${esc(t.venue)}</div><div style="font-size:13px;margin-top:4px">좌석 <b>${t.seats.join(", ")}</b>${t.wine?` · 터널 칸 <b>${t.wine}</b>`:""}</div></div></div>
      <div class="foot"><span class="code">${fmt(t.price)}</span>${t.sample?'<span class="muted">예시 티켓</span>':`<button type="button" class="btn" data-cancel="${i}" style="min-height:36px">예매 취소</button>`}</div>
    </article>`).join("")}</div>
  <div class="card section" style="flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap">
    <div><b>1년 뒤 알림</b><div class="muted" style="font-size:13.5px">와인터널 '내 칸'에 맡긴 감와인이 익으면, 다음 해 영화제 개막 주에 찾으러 오라고 알려 드립니다.</div></div>
    <a class="btn" href="#vote">관객상 투표하기</a>
  </div>`;
  app.querySelectorAll("canvas[data-qr]").forEach(c=>qr(c,c.dataset.qr));
  app.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.cancel;if(b.dataset.armed){state.tickets.splice(i,1);save();toast("예매를 취소했습니다");tickets();return}
    b.dataset.armed="1";b.textContent="한 번 더 누르면 취소";
  });
}

/* ---------- VOTE ---------- */
function vote(){
  const comp=S.filter(s=>s[5]==="모래판 경쟁"||s[5]==="로컬시네마"&&s[3]==="MR");
  app.innerHTML=`
  <h2 class="sec">모래판 관객상</h2>
  <p class="lead">본 영화에 별점을 주세요. 티켓을 가진 회차만 실제 집계에 들어가며, 결과는 폐막작 상영 전 모래판에서 발표합니다.</p>
  <div class="vote-list section" style="margin-top:16px">${comp.map(s=>`
    <div class="card vote"><div style="min-width:0"><span class="code muted">${s[0]}</span><h3 style="font-size:16px">${esc(s[4])}</h3><span class="muted" style="font-size:13px">${s[5]} · ${DAYS[s[1]].d}</span></div>
      <div class="stars" role="group" aria-label="${esc(s[4])} 별점">${[1,2,3,4,5].map(n=>`<button type="button" data-v="${s[0]}" data-n="${n}" aria-pressed="${(state.votes[s[0]]||0)>=n}" aria-label="${n}점">${n}</button>`).join("")}</div></div>`).join("")}</div>`;
  app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{state.votes[b.dataset.v]=+b.dataset.n;save();vote();toast(b.dataset.n+"점을 줬습니다")});
}

const ROUTES={home,program,seats,course,tickets,vote,info,admin};
function route(){
  const h=(location.hash||"#home").slice(1);const fn=ROUTES[h]||home;
  document.querySelectorAll("nav.main a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+(ROUTES[h]?(h==="seats"?"program":h):"home")?"page":"false"));
  fn();window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
window.addEventListener("resize",()=>{if((location.hash||"#home")==="#home")drawSand()});
route();
</script>
