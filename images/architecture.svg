  <text x="32" y="70" font-size="14" fill="#5b6675">GitHub push → GitHub Actions(테스트·배포) → Azure Static Web Apps</text>

  <!-- 사용자 -->
  <rect x="32" y="120" width="170" height="96" rx="14" fill="#fff" stroke="#e7dfd3" stroke-width="2"/>
  <text x="117" y="156" font-size="16" font-weight="800" text-anchor="middle" fill="#111111">어르신</text>
  <text x="117" y="180" font-size="13" text-anchor="middle" fill="#5b6675">사투리 음성·글 예약</text>
