  <text x="117" y="338" font-size="13" text-anchor="middle" fill="#5b6675">기사 동선·좌석 안내</text>

  <!-- SWA -->
  <rect x="262" y="100" width="420" height="276" rx="18" fill="#fdecec" stroke="#E51A24" stroke-width="2"/>
