  <text x="376" y="204" font-size="13" text-anchor="middle" fill="#5b6675">HTML·CSS·JS</text>
  <text x="376" y="224" font-size="13" text-anchor="middle" fill="#5b6675">Leaflet 지도</text>
  <text x="376" y="244" font-size="13" text-anchor="middle" fill="#5b6675">OpenStreetMap</text>

  <rect x="482" y="148" width="180" height="200" rx="12" fill="#fff" stroke="#e7dfd3" stroke-width="2"/>
  <text x="572" y="178" font-size="15" font-weight="800" text-anchor="middle" fill="#111111">Azure Functions</text>
  <text x="572" y="204" font-size="13" text-anchor="middle" fill="#5b6675">/api/parse 사투리 해석</text>
  <text x="572" y="224" font-size="13" text-anchor="middle" fill="#5b6675">/api/match 합승 배차</text>
